name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gateway metadata
        id: gateway-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-gateway
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push gateway
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          tags: ${{ steps.gateway-meta.outputs.tags }}
          labels: ${{ steps.gateway-meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Console metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push console
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PUBLIC_CONSOLE_URL }}
    steps:
      - name: Trigger the gateway deploy (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"

      - name: Wait for readiness
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "PUBLIC_API_URL not set — skipping"; exit 0; fi
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health/ready" | grep -q '"status":"ready"'; then
              echo "gateway ready"; exit 0
            fi
            sleep 10
          done
          echo "::error::gateway did not become ready"; exit 1

      - name: Trigger the console deploy (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"

      - name: Post-deploy smoke
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "skipping"; exit 0; fi
          curl -fsS "$API_URL/v1/models" | head -c 300
          curl -fsS "$API_URL/metrics" | grep -q sentinel_build_info
