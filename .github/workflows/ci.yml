name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.4

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Import check
        run: python -c "from sentinel.main import app; print(len(app.routes), 'routes registered')"

  smoke:
    name: gateway smoke
    runs-on: ubuntu-latest
    needs: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r services/gateway/requirements.txt

      - name: Boot the gateway
        working-directory: services/gateway
        env:
          # No provider keys in CI: the deterministic local engine serves
          # everything, which is exactly why it exists.
          SIMULATE_ONLY: "true"
          BOOTSTRAP_DEMO: "true"
          JWT_SECRET: ci-secret
          LOG_LEVEL: INFO
        run: |
          nohup uvicorn sentinel.main:app --port 8000 > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 2
          done

      - name: Wait for the seeded catalogue
        run: |
          for i in $(seq 1 40); do
            n=$(curl -fsS http://127.0.0.1:8000/api/models | python -c "import sys,json;print(len(json.load(sys.stdin)))")
            echo "catalogue rows: $n"
            [ "$n" -ge 4 ] && exit 0
            sleep 3
          done
          echo "::error::catalogue never seeded"; cat /tmp/gateway.log; exit 1

      - name: Exercise routing, cache, failover, tracing and a load ramp
        run: python scripts/demo.py --base-url http://127.0.0.1:8000

      - name: Assert the gateway measured itself
        run: |
          curl -fsS "http://127.0.0.1:8000/api/overview?hours=24" > overview.json
          python - <<'PY'
          import json, sys
          data = json.load(open("overview.json"))
          traffic, spend, latency = data["traffic"], data["spend"], data["latency"]
          print("requests:", traffic["requests"], "errors:", traffic["error_rate"])
          print("savings ratio:", spend["savings_ratio"])
          print("ttft p95:", latency["ttft_p95"], "overhead p50:", latency["gateway_overhead_p50"])
          if traffic["requests"] < 20:
              sys.exit("::error::too little traffic recorded")
          if spend["baseline_usd"] <= 0:
              sys.exit("::error::no baseline cost computed, savings would be meaningless")
          if traffic["error_rate"] > 0.2:
              sys.exit("::error::error rate too high")
          PY

      - name: Assert a full trace exists
        run: |
          curl -fsS "http://127.0.0.1:8000/api/traces?limit=1" > traces.json
          python - <<'PY'
          import json, subprocess, sys
          traces = json.load(open("traces.json"))
          if not traces:
              sys.exit("::error::no traces recorded")
          trace_id = traces[0]["trace_id"]
          raw = subprocess.check_output(
              ["curl", "-fsS", f"http://127.0.0.1:8000/api/traces/{trace_id}"]
          )
          trace = json.loads(raw)
          names = {span["name"] for span in trace["spans"]}
          print("spans:", sorted(names))
          if not any(n.startswith("upstream.") for n in names):
              sys.exit("::error::no upstream span in the trace")
          if "route.decide" not in names:
              sys.exit("::error::no routing span in the trace")
          PY

      - name: Assert metrics are exported
        run: |
          curl -fsS http://127.0.0.1:8000/metrics > metrics.txt
          for metric in sentinel_inferences_total sentinel_tokens_total sentinel_cost_usd_total \
                        sentinel_time_to_first_token_seconds sentinel_circuit_state \
                        sentinel_inflight_requests sentinel_spans_recorded_total; do
            grep -q "$metric" metrics.txt || { echo "::error::missing $metric"; exit 1; }
          done

      - name: Gateway log
        if: always()
        run: tail -n 120 /tmp/gateway.log

  web:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  images:
    name: container images
    runs-on: ubuntu-latest
    needs: [gateway, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: false
          tags: sentinel-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: sentinel-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomize overlays
        run: |
          kubectl kustomize infra/k8s/base > /tmp/base.yaml
          kubectl kustomize infra/k8s/overlays/production > /tmp/prod.yaml
          wc -l /tmp/base.yaml /tmp/prod.yaml
      - name: Validate against the Kubernetes schema
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # KEDA and Prometheus Operator CRDs are not in the default schema set.
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/prod.yaml
