global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: sentinel

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: sentinel-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          component: gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
