apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    # Streaming completions can run long and must not be buffered.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Rate limiting belongs at the edge; the gateway's buckets are per process.
    nginx.ingress.kubernetes.io/limit-rps: "40"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sentinel.example.com
      secretName: sentinel-tls
  rules:
    - host: sentinel.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: sentinel-gateway
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sentinel-gateway
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: sentinel-gateway
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: sentinel-gateway
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: sentinel-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel-web
                port:
                  name: http
