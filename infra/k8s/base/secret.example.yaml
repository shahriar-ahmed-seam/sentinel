# Template only. Generate the real Secret from a manager (External Secrets,
# Sealed Secrets, SOPS) or imperatively:
#
#   kubectl -n sentinel create secret generic sentinel-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host/db?sslmode=require' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_EMAIL='ops@example.com' \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DEEPSEEK_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  labels:
    app.kubernetes.io/part-of: sentinel
type: Opaque
stringData:
  DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
  JWT_SECRET: replace-me-with-32-random-bytes
  ADMIN_EMAIL: admin@sentinel.dev
  ADMIN_PASSWORD: replace-me
  # Optional upstream credentials. Omit them and the gateway routes to its
  # deterministic local engine instead of failing to start.
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
